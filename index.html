<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1 class="title">待辦清單</h1>

      <div class="input-row">
        <input id="todo-input" type="text" placeholder="輸入待辦事項，按 Enter 或按 新增" aria-label="新增待辦輸入框">
        <button id="add-btn">新增</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

      <div class="footer">
        <p id="empty-msg" class="empty">還沒有任何待辦事項,新增一個吧!</p>
        <p id="count">未完成: 0 項</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
